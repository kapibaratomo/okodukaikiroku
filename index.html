<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お小遣い記録</title>
    <link rel="stylesheet" href="style.css?v=20261018_1">
    <!-- Chart.js and html2pdf.js for graphs and iPhone PDF export -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Screen Styles for Modal */
        @media screen {
            .modal-overlay {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                background: rgba(15, 23, 42, 0.65) !important;
                backdrop-filter: blur(4px) !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                z-index: 9999 !important;
                padding: 16px !important;
                box-sizing: border-box !important;
            }
            .modal-overlay.hidden {
                display: none !important;
            }
            .modal-card {
                background: #ffffff !important;
                width: 100% !important;
                max-width: 680px !important;
                max-height: 90vh !important;
                border-radius: 16px !important;
                display: flex !important;
                flex-direction: column !important;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
                overflow: hidden !important;
            }
        }

        /* Clean Full-Page Print Styles (Windows & AirPrint) */
        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm 12mm;
            }
            body {
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .container, #loadingOverlay, .modal-header, .modal-actions-bar, .close-btn {
                display: none !important;
            }
            .modal-overlay {
                position: static !important;
                width: 100% !important;
                height: auto !important;
                background: none !important;
                backdrop-filter: none !important;
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
            }
            .modal-card {
                position: static !important;
                max-width: 100% !important;
                width: 100% !important;
                max-height: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                background: none !important;
                overflow: visible !important;
            }
            .modal-scroll-area {
                padding: 0 !important;
                background: none !important;
                overflow: visible !important;
                max-height: none !important;
            }
            .report-paper {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                background: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>同期中...</p>
    </div>

    <div class="container">
        <header>
            <div class="header-top">
                <h1>お小遣い記録</h1>
                <div style="display:flex; align-items:center; gap:8px;">
                    <button id="settingsBtn" class="icon-btn" title="設定">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                </div>
            </div>
            <div class="balance-cards">
                <div class="card-group">
                    <div class="card pasmo">
                        <span class="label">PASMO</span>
                        <span class="amount" id="pasmoBalance">¥0</span>
                    </div>
                    <div class="card cash">
                        <span class="label">現金</span>
                        <span class="amount" id="cashBalance">¥0</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- 1. 記録を追加 -->
        <section class="add-transaction">
            <h2>記録を追加</h2>
            <form id="transactionForm">
                <div class="form-group toggle-group">
                    <input type="radio" id="typePasmo" name="type" value="pasmo" checked>
                    <label for="typePasmo" class="toggle-btn toggle-pasmo">PASMO</label>
                    
                    <input type="radio" id="typeCash" name="type" value="cash">
                    <label for="typeCash" class="toggle-btn toggle-cash">現金</label>
                </div>
                
                <div class="form-group toggle-group">
                    <input type="radio" id="catIncome" name="category" value="income">
                    <label for="catIncome" class="toggle-btn toggle-income">収入 (+)</label>
                    
                    <input type="radio" id="catExpense" name="category" value="expense" checked>
                    <label for="catExpense" class="toggle-btn toggle-expense">支出 (-)</label>
                </div>

                <div class="form-group">
                    <input type="date" id="transactionDate" required>
                </div>

                <div class="form-group">
                    <input type="number" id="amount" placeholder="金額 (円)" required min="1">
                </div>

                <div class="form-group">
                    <input type="text" id="memo" placeholder="メモ (例: ジュース)" required>
                </div>

                <button type="submit" class="btn-submit">追加する</button>
            </form>
        </section>

        <!-- 2. グラフ -->
        <section class="analytics-card">
            <div class="analytics-header">
                <h2>📊 収支・支出グラフ</h2>
                <div class="chart-tab-group">
                    <button id="chartTabCategory" class="chart-tab active" data-tab="category">内訳</button>
                    <button id="chartTabMonthly" class="chart-tab" data-tab="monthly">月別推移</button>
                </div>
            </div>
            
            <!-- 各月切り替えナビゲーション -->
            <div id="chartMonthNav" class="chart-month-nav">
                <button id="chartPrevMonthBtn" type="button" class="month-nav-btn" title="前月へ">◀</button>
                <select id="chartPeriodSelect" class="chart-period-select">
                    <!-- 動的に月が追加されます -->
                </select>
                <button id="chartNextMonthBtn" type="button" class="month-nav-btn" title="次月へ">▶</button>
            </div>

            <div class="chart-wrapper">
                <canvas id="analyticsChart"></canvas>
            </div>
            <div id="chartSummary" class="chart-summary"></div>
        </section>

        <!-- 3. 印刷 (PDF出力) -->
        <section class="pdf-export">
            <h2>🖨️ レポート印刷 / PDF出力</h2>
            <div class="form-group" style="display: flex; gap: 8px;">
                <input type="month" id="reportMonth" style="flex: 1;" required>
                <select id="reportType" style="flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 16px; outline: none; font-family: inherit; background-color: var(--surface-color);">
                    <option value="all">すべて</option>
                    <option value="pasmo">PASMO</option>
                    <option value="cash">現金</option>
                </select>
            </div>
            <div class="pdf-buttons" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                <button id="openReportModalBtn" class="btn-submit" style="background: #2563eb; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    レポートを開く (PDF保存 / 印刷)
                </button>
            </div>
            <p class="iphone-tip">
                💡 <strong>iPhone & Windows対応:</strong> ボタンを押すとプレビューが表示されます。iPhoneは「PDFを保存」、Windowsは「印刷」からPDF保存やプリンター印刷が確実に行えます。
            </p>
        </section>

        <!-- 4. 履歴 -->
        <section class="history">
            <div class="history-header">
                <h2>履歴</h2>
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">すべて</button>
                    <button class="filter-btn" data-filter="pasmo">PASMO</button>
                    <button class="filter-btn" data-filter="cash">現金</button>
                </div>
            </div>
            
            <ul id="historyList" class="history-list">
                <!-- 履歴がここに追加されます -->
            </ul>
        </section>

        <section id="settingsSection" class="data-management hidden">
            <h2>GitHub同期設定</h2>
            <p class="help-text">自動同期のためにはPersonal Access Tokenが必要です。</p>
            <div class="form-group">
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxx">
            </div>
            <div class="data-actions">
                <button id="saveTokenBtn" class="btn-outline">
                    設定を保存して同期
                </button>
            </div>
            <div id="syncStatus" class="sync-status text-sm mt-3 text-center">
                <!-- ステータスメッセージ -->
            </div>
        </section>
    </div>

    <!-- レポートプレビュー＆印刷用モーダル -->
    <div id="reportModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">📄 レポート プレビュー</h3>
                <button id="closeModalBtn" class="close-btn" title="閉じる">✕</button>
            </div>
            <div class="modal-actions-bar">
                <button id="modalDownloadPdfBtn" class="btn-submit modal-action-btn pdf-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    PDFを保存
                </button>
                <button id="modalPrintBtn" class="btn-outline modal-action-btn print-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    印刷 (Windows / AirPrint)
                </button>
            </div>
            <div class="modal-scroll-area">
                <div id="reportPrintContent" class="report-paper">
                    <!-- レポート内容がここに描画されます -->
                </div>
            </div>
        </div>
    </div>

    <script src="config.js?v=20261018_1"></script>
    <script src="app.js?v=20261018_1"></script>
</body>
</html>
